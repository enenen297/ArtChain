<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Main Letter A Gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Accent Geometric Ribbon Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Drop Shadow for Standout Effect -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Logo Group without background element -->
  <g filter="url(#glowShadow)">
    <!-- Base Structure: Right Leg & Main Body -->
    <path d="M 250,80 L 380,380 L 310,380 L 250,240 L 190,380 L 120,380 Z" fill="url(#mainGrad)" />
    
    <!-- Left Dynamic Overlay Stripe (Geometric Cut) -->
    <path d="M 250,80 L 120,380 L 180,380 L 250,210 L 295,310 L 330,230 Z" fill="url(#accentGrad)" />

    <!-- Negative Space Cutout (Transparent Triangle) -->
    <polygon points="250,145 210,235 290,235" fill="none" />
  </g>
</svg>
